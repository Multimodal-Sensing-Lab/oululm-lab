<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1190" role="img"><title>Two loops around the same network</title><desc>Follow what changes: persistent parameters during training; temporary context during inference.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#47617f"/></marker><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#91a5be" flood-opacity=".18"/></filter></defs><rect width="1160" height="1190" rx="24" fill="#f3f6fb"/><g font-family="Inter,system-ui,sans-serif" fill="#19324f"><rect x="24" y="24" width="1112" height="102" rx="18" fill="#152e4c"/><text x="56" y="66" font-size="29" font-weight="700" fill="white">Two loops around the same network</text><text x="56" y="98" font-size="17" fill="#c8d9ee">Follow what changes: persistent parameters during training; temporary context during inference.</text><text x="58" y="167" font-size="24" fill="#226a48" font-weight="700">TRAINING / ADAPTATION</text><text x="610" y="167" font-size="24" fill="#a16014" font-weight="700">INFERENCE / GENERATION</text><g filter="url(#shadow)"><rect x="52" y="192" width="508" height="135" rx="14" fill="white" stroke="#c6d4e5"/><rect x="52" y="192" width="9" height="135" rx="4" fill="#55a87a"/></g><text x="76" y="223" font-size="21" font-weight="700">Data → fixed splits</text><text x="76" y="252" font-size="16" fill="#445d79">Collect / clean / deduplicate.</text><text x="76" y="276" font-size="16" fill="#445d79">Reserve validation and test examples.</text><g filter="url(#shadow)"><rect x="601" y="192" width="508" height="135" rx="14" fill="white" stroke="#c6d4e5"/><rect x="601" y="192" width="9" height="135" rx="4" fill="#e4aa4f"/></g><text x="625" y="223" font-size="21" font-weight="700">Load model + tokenizer</text><text x="625" y="252" font-size="16" fill="#445d79">Load matching configuration and weights.</text><text x="625" y="276" font-size="16" fill="#445d79">Optional adapter changes effective parameters.</text><path d="M304 327 L304 359" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M855 327 L855 359" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><g filter="url(#shadow)"><rect x="52" y="365" width="508" height="135" rx="14" fill="white" stroke="#c6d4e5"/><rect x="52" y="365" width="9" height="135" rx="4" fill="#55a87a"/></g><text x="76" y="396" font-size="21" font-weight="700">Tokenizer → batches → targets</text><text x="76" y="425" font-size="16" fill="#445d79">Fit tokenizer on train, or load the matching one.</text><text x="76" y="449" font-size="16" fill="#445d79">Encode; shift next-token targets; mask loss positions.</text><g filter="url(#shadow)"><rect x="601" y="365" width="508" height="135" rx="14" fill="white" stroke="#c6d4e5"/><rect x="601" y="365" width="9" height="135" rx="4" fill="#e4aa4f"/></g><text x="625" y="396" font-size="21" font-weight="700">Question + optional retrieved evidence</text><text x="625" y="425" font-size="16" fill="#445d79">RAG: documents → chunks → search → passages.</text><text x="625" y="449" font-size="16" fill="#445d79">Assemble the prompt / chat template.</text><path d="M304 500 L304 532" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M855 500 L855 532" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><g filter="url(#shadow)"><rect x="52" y="538" width="508" height="135" rx="14" fill="white" stroke="#c6d4e5"/><rect x="52" y="538" width="9" height="135" rx="4" fill="#55a87a"/></g><text x="76" y="569" font-size="21" font-weight="700">Initialize or load → forward</text><text x="76" y="598" font-size="16" fill="#445d79">Embeddings → blocks → vocabulary logits.</text><text x="76" y="622" font-size="16" fill="#445d79">Causal attention blocks future positions.</text><g filter="url(#shadow)"><rect x="601" y="538" width="508" height="135" rx="14" fill="white" stroke="#c6d4e5"/><rect x="601" y="538" width="9" height="135" rx="4" fill="#e4aa4f"/></g><text x="625" y="569" font-size="21" font-weight="700">Encode → prompt forward pass</text><text x="625" y="598" font-size="16" fill="#445d79">Check context budget. Produce vocabulary logits.</text><text x="625" y="622" font-size="16" fill="#445d79">A KV cache may reuse earlier computations.</text><path d="M304 673 L304 705" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M855 673 L855 705" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><g filter="url(#shadow)"><rect x="52" y="711" width="508" height="135" rx="14" fill="white" stroke="#c6d4e5"/><rect x="52" y="711" width="9" height="135" rx="4" fill="#55a87a"/></g><text x="76" y="742" font-size="21" font-weight="700">Loss → backward → optimizer</text><text x="76" y="771" font-size="16" fill="#445d79">Measure observed-token prediction penalty.</text><text x="76" y="795" font-size="16" fill="#445d79">Calculate gradients; update trainable parameters.</text><g filter="url(#shadow)"><rect x="601" y="711" width="508" height="135" rx="14" fill="white" stroke="#c6d4e5"/><rect x="601" y="711" width="9" height="135" rx="4" fill="#e4aa4f"/></g><text x="625" y="742" font-size="21" font-weight="700">Choose next token → append</text><text x="625" y="771" font-size="16" fill="#445d79">Temperature / sampling or greedy selection.</text><text x="625" y="795" font-size="16" fill="#445d79">Repeat until stop token or token budget.</text><path d="M304 846 L304 878" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M855 846 L855 878" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><g filter="url(#shadow)"><rect x="52" y="884" width="508" height="135" rx="14" fill="white" stroke="#c6d4e5"/><rect x="52" y="884" width="9" height="135" rx="4" fill="#55a87a"/></g><text x="76" y="915" font-size="21" font-weight="700">Repeat → validate → checkpoint</text><text x="76" y="944" font-size="16" fill="#445d79">Monitor held-out loss without updates.</text><text x="76" y="968" font-size="16" fill="#445d79">Save weights/config/tokenizer; then test.</text><g filter="url(#shadow)"><rect x="601" y="884" width="508" height="135" rx="14" fill="white" stroke="#c6d4e5"/><rect x="601" y="884" width="9" height="135" rx="4" fill="#e4aa4f"/></g><text x="625" y="915" font-size="21" font-weight="700">Decode → inspect / evaluate</text><text x="625" y="944" font-size="16" fill="#445d79">IDs become text. Preserve raw outputs.</text><text x="625" y="968" font-size="16" fill="#445d79">Compare fixed prompts and decoding settings.</text><text x="64" y="1105" font-size="18" fill="#226a48">↺ Optimizer update → next training batch</text><text x="613" y="1105" font-size="18" fill="#a16014">↺ Appended token → next prediction</text><text x="64" y="1150" font-size="16">LoRA updates selected adapter matrices. RAG supplies evidence to the inference prompt.</text></g></svg>