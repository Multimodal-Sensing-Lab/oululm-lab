<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1340" role="img"><title>Inside a tiny GPT-style language model</title><desc>The same forward path is used before training, during learning, and at inference.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#47617f"/></marker><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#91a5be" flood-opacity=".18"/></filter></defs><rect width="1160" height="1340" rx="24" fill="#f3f6fb"/><g font-family="Inter,system-ui,sans-serif" fill="#19324f"><rect x="24" y="24" width="1112" height="102" rx="18" fill="#152e4c"/><text x="56" y="66" font-size="29" font-weight="700" fill="white">Inside a tiny GPT-style language model</text><text x="56" y="98" font-size="17" fill="#c8d9ee">The same forward path is used before training, during learning, and at inference.</text><g filter="url(#shadow)"><rect x="72" y="155" width="550" height="88" rx="14" fill="white" stroke="#c6d4e5"/><rect x="72" y="155" width="9" height="88" rx="4" fill="#5c9ce0"/></g><text x="96" y="186" font-size="21" font-weight="700">Raw input text</text><text x="96" y="215" font-size="16" fill="#445d79">“the cat sat.”  ·  characters, spaces and punctuation</text><path d="M347 243 L347 267" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><g filter="url(#shadow)"><rect x="72" y="272" width="550" height="113" rx="14" fill="white" stroke="#c6d4e5"/><rect x="72" y="272" width="9" height="113" rx="4" fill="#5297df"/></g><text x="96" y="303" font-size="21" font-weight="700">Tokenizer</text><text x="96" y="332" font-size="16" fill="#445d79">Split into pieces, then use a fixed vocabulary lookup.</text><text x="96" y="356" font-size="16" fill="#445d79">Our demo: character tokens. Other models often use subwords.</text><text x="602" y="302" text-anchor="end" font-size="13" fill="#61748f">001</text><g filter="url(#shadow)"><rect x="688" y="272" width="395" height="113" rx="14" fill="white" stroke="#c6d4e5"/><rect x="688" y="272" width="9" height="113" rx="4" fill="#5297df"/></g><text x="712" y="303" font-size="21" font-weight="700">Data crossing this boundary</text><text x="712" y="332" font-size="16" fill="#445d79">Integer IDs: [26, 16, 13, …]</text><text x="712" y="356" font-size="16" fill="#445d79">An ID is an index, not an embedding.</text><path d="M622 328 L676 328" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M347 385 L347 412" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><g filter="url(#shadow)"><rect x="72" y="416" width="550" height="113" rx="14" fill="white" stroke="#c6d4e5"/><rect x="72" y="416" width="9" height="113" rx="4" fill="#36a58c"/></g><text x="96" y="447" font-size="21" font-weight="700">Token embedding + position</text><text x="96" y="476" font-size="16" fill="#445d79">Look up vectors; add our learned position vectors.</text><text x="96" y="500" font-size="16" fill="#445d79">B × T IDs → B × T × C feature values</text><text x="602" y="446" text-anchor="end" font-size="13" fill="#61748f">002</text><g filter="url(#shadow)"><rect x="688" y="416" width="395" height="113" rx="14" fill="white" stroke="#c6d4e5"/><rect x="688" y="416" width="9" height="113" rx="4" fill="#36a58c"/></g><text x="712" y="447" font-size="21" font-weight="700">One vector per position</text><text x="712" y="476" font-size="16" fill="#445d79">Example width C = 64</text><text x="712" y="500" font-size="16" fill="#445d79">Repeated tokens share the token vector.</text><path d="M622 472 L676 472" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M347 529 L347 557" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="48" y="561" width="1060" height="322" rx="22" fill="#eee6fa" stroke="#a688c5" stroke-width="2"/><text x="73" y="592" font-size="22" font-weight="700" fill="#674090">TRANSFORMER ENGINE · repeat two blocks</text><g filter="url(#shadow)"><rect x="72" y="613" width="550" height="110" rx="14" fill="white" stroke="#c6d4e5"/><rect x="72" y="613" width="9" height="110" rx="4" fill="#9870c4"/></g><text x="96" y="644" font-size="21" font-weight="700">1. Normalize → causal self-attention</text><text x="96" y="673" font-size="16" fill="#445d79">Q/K/V → masked scores → weighted values → projection</text><text x="96" y="697" font-size="16" fill="#445d79">Residual: add the input back to this update.</text><text x="602" y="643" text-anchor="end" font-size="13" fill="#61748f">003</text><path d="M347 723 L347 744" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><g filter="url(#shadow)"><rect x="72" y="749" width="550" height="110" rx="14" fill="white" stroke="#c6d4e5"/><rect x="72" y="749" width="9" height="110" rx="4" fill="#9870c4"/></g><text x="96" y="780" font-size="21" font-weight="700">2. Normalize → feed-forward network</text><text x="96" y="809" font-size="16" fill="#445d79">Linear 64 → 256 → GELU → linear 256 → 64</text><text x="96" y="833" font-size="16" fill="#445d79">Residual: add again. Shape stays B × T × 64.</text><g filter="url(#shadow)"><rect x="688" y="613" width="395" height="246" rx="14" fill="white" stroke="#c6d4e5"/><rect x="688" y="613" width="9" height="246" rx="4" fill="#9870c4"/></g><text x="712" y="644" font-size="21" font-weight="700">What flows through the blocks?</text><text x="712" y="673" font-size="16" fill="#445d79">Contextual feature vectors.</text><text x="712" y="697" font-size="16" fill="#445d79">Attention mixes allowed positions.</text><text x="712" y="721" font-size="16" fill="#445d79">The FFN transforms each position.</text><text x="712" y="745" font-size="16" fill="#445d79"></text><text x="712" y="769" font-size="16" fill="#445d79">Blocks have the same structure,</text><text x="712" y="793" font-size="16" fill="#445d79">but separate parameters.</text><text x="712" y="817" font-size="16" fill="#445d79">Future input positions are blocked.</text><path d="M347 883 L347 908" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><g filter="url(#shadow)"><rect x="72" y="912" width="550" height="104" rx="14" fill="white" stroke="#c6d4e5"/><rect x="72" y="912" width="9" height="104" rx="4" fill="#ecaa4d"/></g><text x="96" y="943" font-size="21" font-weight="700">Final normalization → LM head</text><text x="96" y="972" font-size="16" fill="#445d79">Project features to one raw score per vocabulary entry.</text><text x="96" y="996" font-size="16" fill="#445d79">Logits shape: B × T × V. Our reference V = 32.</text><text x="602" y="942" text-anchor="end" font-size="13" fill="#61748f">005</text><g filter="url(#shadow)"><rect x="688" y="912" width="395" height="104" rx="14" fill="white" stroke="#c6d4e5"/><rect x="688" y="912" width="9" height="104" rx="4" fill="#ecaa4d"/></g><text x="712" y="943" font-size="21" font-weight="700">Logits are NOT probabilities</text><text x="712" y="972" font-size="16" fill="#445d79">Scores can be negative or positive.</text><text x="712" y="996" font-size="16" fill="#445d79">Softmax is a separate operation.</text><path d="M347 1016 L347 1042" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><g filter="url(#shadow)"><rect x="72" y="1048" width="550" height="112" rx="14" fill="white" stroke="#c6d4e5"/><rect x="72" y="1048" width="9" height="112" rx="4" fill="#d88480"/></g><text x="96" y="1079" font-size="21" font-weight="700">Inference: softmax / decoding</text><text x="96" y="1108" font-size="16" fill="#445d79">Take the last position. Adjust temperature if sampling.</text><text x="96" y="1132" font-size="16" fill="#445d79">Select a token → append → predict again → decode IDs.</text><text x="602" y="1078" text-anchor="end" font-size="13" fill="#61748f">005</text><g filter="url(#shadow)"><rect x="688" y="1048" width="395" height="112" rx="14" fill="white" stroke="#c6d4e5"/><rect x="688" y="1048" width="9" height="112" rx="4" fill="#529c68"/></g><text x="712" y="1079" font-size="21" font-weight="700">Training branch: loss + update</text><text x="712" y="1108" font-size="16" fill="#445d79">Cross-entropy uses logits + targets.</text><text x="712" y="1132" font-size="16" fill="#445d79">Backward → gradients → optimizer.</text><text x="1063" y="1078" text-anchor="end" font-size="13" fill="#61748f">004</text><path d="M622 965 L657 965" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M657 965 V1105 H679" stroke="#47617f" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="72" y="1210" font-size="20" font-weight="700">Training changes weights. Inference changes context.</text><text x="72" y="1244" font-size="17">Our first run has initialized parameters but zero training updates. Predictions already exist.</text><text x="72" y="1280" font-size="15" fill="#60738c">Original OuluLLM Lab diagram · matches llm_workshop/tiny.py · each number names a teaching topic.</text></g></svg>