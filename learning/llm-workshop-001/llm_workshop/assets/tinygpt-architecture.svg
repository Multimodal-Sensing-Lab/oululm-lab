<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 990" role="img" aria-labelledby="title desc"><title id="title">Our two-block TinyGPT architecture</title><desc id="desc">A downward forward path branches into loss and parameter updates for training or selecting and appending tokens for generation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#435b79"/></marker></defs><rect width="1100" height="990" fill="white"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17283c"><text x="550" y="30" font-size="24" font-weight="bold">Our model, before or after training</text><rect x="270" y="60" width="560" height="72" rx="10" fill="#eaf4ff" stroke="#8097b2" stroke-width="2"/><text x="550" y="88" font-size="20" font-weight="bold">Text → character tokenizer → IDs</text><text x="550" y="114" font-size="17">Reference input: 11 positions; vocabulary: 32 entries</text><rect x="270" y="160" width="560" height="72" rx="10" fill="#eaf4ff" stroke="#8097b2" stroke-width="2"/><text x="550" y="188" font-size="20" font-weight="bold">Token embedding + position embedding</text><text x="550" y="214" font-size="17">[1, 11] IDs → [1, 11, 64] feature values</text><rect x="210" y="265" width="680" height="115" rx="10" fill="#f4eafa" stroke="#8097b2" stroke-width="2"/><text x="550" y="293" font-size="20" font-weight="bold">Transformer block 1</text><text x="550" y="319" font-size="17">LayerNorm → causal attention (2 heads) → residual add</text><text x="550" y="344" font-size="17">LayerNorm → MLP (64 → 256 → 64) → residual add</text><rect x="210" y="415" width="680" height="115" rx="10" fill="#f4eafa" stroke="#8097b2" stroke-width="2"/><text x="550" y="443" font-size="20" font-weight="bold">Transformer block 2</text><text x="550" y="469" font-size="17">Same operations; separate weights</text><text x="550" y="494" font-size="17">Shape remains [1, 11, 64]</text><rect x="270" y="570" width="560" height="72" rx="10" fill="#eaf4ff" stroke="#8097b2" stroke-width="2"/><text x="550" y="598" font-size="20" font-weight="bold">Final LayerNorm → vocabulary head</text><text x="550" y="624" font-size="17">[1, 11, 64] → logits [1, 11, 32]</text><rect x="25" y="720" width="490" height="100" rx="10" fill="#ecf8ee" stroke="#8097b2" stroke-width="2"/><text x="270" y="748" font-size="20" font-weight="bold">TRAINING: compare with target IDs</text><text x="270" y="774" font-size="17">Cross-entropy → mean loss</text><text x="270" y="799" font-size="17">Backward → gradients → optimizer update</text><rect x="585" y="720" width="490" height="100" rx="10" fill="#fff4dc" stroke="#8097b2" stroke-width="2"/><text x="830" y="748" font-size="20" font-weight="bold">INFERENCE: use last position’s scores</text><text x="830" y="774" font-size="17">Temperature / decoding policy → selected token</text><text x="830" y="799" font-size="17">Append token → predict again → decode to text</text><g fill="none" stroke="#435b79" stroke-width="2.5" marker-end="url(#arrow)"><path d="M550 132 V155"/><path d="M550 232 V260"/><path d="M550 380 V410"/><path d="M550 530 V565"/><path d="M550 642 V680 H270 V715"/><path d="M550 680 H830 V715"/></g><text x="270" y="856" font-size="19" font-weight="bold">↺ Update trainable weights, then repeat</text><text x="830" y="856" font-size="19" font-weight="bold">↺ Extend input; keep weights fixed</text><text x="550" y="917" font-size="19">Today: forward pass and scoring only. No backward pass or optimizer.</text><text x="550" y="949" font-size="17">Token IDs are indices. Embedding vectors and intermediate features are numerical arrays.</text></g></svg>